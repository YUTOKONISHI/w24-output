name: linter

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '22'

      - name: Install Dependencies
        run: |
          composer install -q --no-ansi --no-interaction --no-progress --prefer-dist
          npm ci

      - name: Copy Environment File
        run: cp .env.example .env

      # resources/js の actions / routes / wayfinder は .gitignore 済みで、
      # チェックアウト直後には存在しない。無いまま eslint を掛けると
      # @/routes/... が解決できず import/order の分類が変わって落ちる。
      # vite.config.ts の formVariants: true に合わせて --with-form を付ける。
      - name: Generate Wayfinder Definitions
        run: php artisan wayfinder:generate --with-form

      - name: Check PHP Formatting
        run: composer lint:check

      - name: Check Frontend Formatting
        run: npm run format:check

      - name: Lint Frontend
        run: npm run lint:check
